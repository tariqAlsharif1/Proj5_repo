<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home - User Registration</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 20px auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .navbar { display: flex; gap: 15px; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 2px solid #eee; }
        .navbar a { text-decoration: none; color: #3498db; font-weight: bold; padding: 6px 12px; border-radius: 4px; transition: background 0.2s; }
        .navbar a:hover, .navbar a.active { background: #3498db; color: white; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; color: #555; }
        input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 15px; box-sizing: border-box; }
        button { background-color: #2ecc71; color: white; border: none; padding: 10px 18px; font-size: 15px; border-radius: 6px; cursor: pointer; width: 100%; }
        button:hover { background-color: #27ae60; }
        .success-box { background: #e8f8f5; border-left: 5px solid #2ecc71; padding: 15px; margin-top: 15px; border-radius: 4px; font-size: 16px; }
        .error-box { background: #fdebd0; border-left: 5px solid #e74c3c; padding: 12px; margin-top: 15px; border-radius: 4px; color: #c0392b; }
    </style>
</head>
<body>
<div class="container">
    <div class="navbar">
        <a href="/" class="active">Register / Profile</a>
        <a href="/recommendations">My Dashboard</a>
        <a href="/courses">All Courses</a>
        <a href="/skills">My Skills</a>
    </div>

    <h2>User Registration Portal</h2>
    <div class="form-group">
        <label for="regUsername">Your Name / Username:</label>
        <input type="text" id="regUsername" placeholder="e.g., Ahmad Ali">
    </div>
    <div class="form-group">
        <label for="regSkills">Your Core Skills (comma separated):</label>
        <input type="text" id="regSkills" placeholder="e.g., Python, SQL, AI">
    </div>
    <button onclick="registerUser()">Register & Save Profile</button>
    <div id="regResponse"></div>
</div>

<script>
async function registerUser() {
    const username = document.getElementById('regUsername').value.trim();
    const skillsText = document.getElementById('regSkills').value.trim();
    const responseBox = document.getElementById('regResponse');

    if (!username) { 
        alert("Please enter a username."); 
        return; 
    }
    
    const skillsArray = skillsText ? skillsText.split(',').map(s => s.trim()) : [];

    try {
        const res = await fetch('/api/user/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: username, skills: skillsArray })
        });
        const data = await res.json();
        
        if (res.ok) {
            responseBox.innerHTML = `
                <div class="success-box">
                    ✅ <strong>Registered Successfully!</strong><br><br>
                    👤 Username: <strong>${data.username}</strong><br>
                    🔑 Your User ID is: <span style="background: #2ecc71; color: white; padding: 2px 8px; border-radius: 4px; font-size: 18px;">${data.user_id}</span><br>
                    <small style="color: #555; display:block; margin-top:5px;">(Copy this ID to use it in "My Dashboard" or "My Skills" pages)</small>
                </div>
            `;
            // تفريغ الحقول بعد التسجيل الناجح
            document.getElementById('regUsername').value = '';
            document.getElementById('regSkills').value = '';
        } else {
            responseBox.innerHTML = `<div class="error-box">Error: ${data.error || 'Something went wrong'}</div>`;
        }
    } catch (err) {
        responseBox.innerHTML = `<div class="error-box">Connection error occurred.</div>`;
    }
}
</script>
</body>
</html>
