<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register Profile</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f9f9f9; }
        nav { background: #333; padding: 15px; border-radius: 5px; margin-bottom: 20px; }
        nav a { color: white; text-decoration: none; margin-right: 15px; padding: 8px 12px; background: #555; border-radius: 4px; }
        nav a:hover { background: #777; }
        input { display: block; margin: 12px 0; padding: 10px; width: 320px; border: 1px solid #ccc; border-radius: 4px; }
        button { cursor: pointer; padding: 10px 20px; background: #007BFF; color: white; border: none; border-radius: 4px; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <nav>
        <a href="/">Register</a>
        <a href="/courses">Courses</a>
        <a href="/skills">My Skills</a>
    </nav>

    <h2>Create User Profile</h2>
    <input type="text" id="username" placeholder="Username (e.g. Huda)">
    <input type="text" id="skillsInput" placeholder="Skills (comma separated, e.g. Python, SQL)">
    <button onclick="createUserData()">Save Data</button>
    <p id="regStatus" style="font-weight: bold; margin-top: 15px;"></p>

    <script>
        async function createUserData() {
            const name = document.getElementById('username').value.trim();
            const rawSkills = document.getElementById('skillsInput').value;
            
            if (!name) { alert("Please enter a username."); return; }

            const skillsArray = rawSkills ? rawSkills.split(',').map(s => s.trim()) : [];
            const payload = { username: name, skills: skillsArray };

            try {
                const res = await fetch('/api/user/create', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                const statusEl = document.getElementById('regStatus');
                
                if (res.ok) {
                    statusEl.style.color = "green";
                    statusEl.innerText = "Saved successfully! Redirecting...";
                    setTimeout(() => {
                        window.location.href = "/courses";
                    }, 1000);
                } else {
                    statusEl.style.color = "red";
                    statusEl.innerText = "Error: " + (data.error || "Unknown error");
                }
            } catch (err) {
                console.error("Network error:", err);
                alert("Failed to connect to server.");
            }
        }
    </script>
</body>
</html>
