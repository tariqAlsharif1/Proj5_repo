<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Skills Page</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f9f9f9; }
        nav { background: #333; padding: 15px; border-radius: 5px; margin-bottom: 20px; }
        nav a { color: white; text-decoration: none; margin-right: 15px; padding: 8px 12px; background: #555; border-radius: 4px; }
        nav a:hover { background: #777; }
        select { display: block; margin: 12px 0; padding: 10px; width: 340px; border: 1px solid #ccc; border-radius: 4px; }
        ul { list-style-type: disc; padding-left: 20px; }
        li { margin-bottom: 6px; }
    </style>
</head>
<body>
    <nav>
        <a href="/">Register</a>
        <a href="/courses">Courses</a>
        <a href="/skills">My Skills</a>
    </nav>

    <h2>View User Skills</h2>
    <label for="skillsUserSelect"><b>Select User:</b></label>
    <select id="skillsUserSelect" onclick="loadSkillsUsersDropdown()" onchange="loadSkillsBySelect()">
        <option value="">-- Select User --</option>
    </select>
    
    <h3 id="profileTitle"></h3>
    <ul id="skillsList">
        <li>Please select a user to view their skills.</li>
    </ul>

    <script>
        window.onload = function() {
            loadSkillsUsersDropdown();
        };

        async function loadSkillsUsersDropdown() {
            const selectElement = document.getElementById('skillsUserSelect');
            const currentValue = selectElement.value;

            const res = await fetch('/api/users');
            const users = await res.json();
            
            selectElement.innerHTML = '<option value="">-- Select User --</option>' + 
                users.map(u => `<option value="${u.id}">${u.username}</option>`).join('');
            
            if (currentValue) selectElement.value = currentValue;
        }

        async function loadSkillsBySelect() {
            const userId = document.getElementById('skillsUserSelect').value;
            const listElement = document.getElementById('skillsList');
            const titleElement = document.getElementById('profileTitle');
            
            if (!userId) { 
                titleElement.innerText = ""; 
                listElement.innerHTML = "<li>Please select a user to view their skills.</li>"; 
                return; 
            }
            
            const res = await fetch(`/api/user/${userId}/skills`);
            const data = await res.json();
            
            if(res.ok) {
                titleElement.innerText = `Skills List:`;
                if(data.skills.length === 0) {
                    listElement.innerHTML = "<li>No skills found.</li>";
                } else {
                    listElement.innerHTML = data.skills.map(s => `<li>${s}</li>`).join('');
                }
            } else {
                titleElement.innerText = "";
                listElement.innerHTML = `<li>User not found</li>`;
            }
        }
    </script>
</body>
</html>
